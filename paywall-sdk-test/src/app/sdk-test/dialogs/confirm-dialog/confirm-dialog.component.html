<div class="dialog-backdrop" *ngIf="show" (click)="onBackdropClick($event)">
  <div class="dialog-container" (click)="$event.stopPropagation()">
    <div class="dialog-header">
      <h3>{{ title }}</h3>
      <button class="close-btn" (click)="cancel()">&times;</button>
    </div>
    <div class="dialog-body">
      <p>{{ message }}</p>
    </div>
    <div class="dialog-footer">
      <button class="btn btn-secondary" (click)="cancel()">No</button>
      <button class="btn btn-primary" (click)="confirm()">Yes</button>
    </div>
  </div>
</div>
