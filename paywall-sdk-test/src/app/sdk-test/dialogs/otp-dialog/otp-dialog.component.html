<div class="dialog-backdrop" *ngIf="show" (click)="onBackdropClick($event)">
  <div class="dialog-container" (click)="$event.stopPropagation()">
    <div class="dialog-header">
      <h3>{{ title }}</h3>
      <button class="close-btn" (click)="cancel()">&times;</button>
    </div>
    <div class="dialog-body">
      <p *ngIf="message">{{ message }}</p>
      <p *ngIf="resendMessage" class="resend-message" [class.error]="resendMessage.indexOf('hata') !== -1 || resendMessage.indexOf('gönderilemedi') !== -1">{{ resendMessage }}</p>
      <div class="form-group">
        <label>OTP Code:</label>
        <input 
          type="text" 
          [(ngModel)]="otpCode" 
          placeholder="Enter OTP code"
          class="form-control"
          (keyup.enter)="confirm()"
          autofocus
        />
      </div>
    </div>
    <div class="dialog-footer">
      <button class="btn btn-secondary" (click)="resendOtp()" [disabled]="resendLoading">{{ resendLoading ? 'Gönderiliyor...' : 'Resend OTP' }}</button>
      <div class="spacer"></div>
      <button class="btn btn-secondary" (click)="cancel()">Cancel</button>
      <button class="btn btn-primary" (click)="confirm()" [disabled]="!otpCode.trim()">Confirm</button>
    </div>
  </div>
</div>
